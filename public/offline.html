<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>موعدلي — غير متصل</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        background: #f7f7f5; color: #1a1a1a; text-align: center; padding: 24px;
      }
      .card { max-width: 380px; }
      .logo {
        width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 20px;
        background: linear-gradient(135deg, #0a7cff, #0052cc);
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #6b6b6b; line-height: 1.7; margin: 0 0 20px; font-size: 14px; }
      button {
        border: 0; border-radius: 999px; padding: 10px 22px; font-size: 14px;
        font-weight: 600; color: #fff; background: #0a7cff; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo"></div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>موعدلي يحتاج اتصالاً بالإنترنت. تحقّق من شبكتك ثم أعد المحاولة.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
