<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="موعدلي">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b4332"/>
      <stop offset="1" stop-color="#0f2620"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7c66a"/>
      <stop offset="1" stop-color="#c2881b"/>
    </linearGradient>
  </defs>

  <!-- Deep pine rounded tile -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- Daybook: a ruled "day" card -->
  <rect x="128" y="132" width="256" height="248" rx="40"
        fill="none" stroke="#3a5c4f" stroke-width="20"/>
  <!-- header band -->
  <path d="M128 172 a40 40 0 0 1 40 -40 h176 a40 40 0 0 1 40 40 v20 H128 Z" fill="#3a5c4f"/>
  <!-- binding pegs -->
  <rect x="188" y="104" width="20" height="52" rx="10" fill="#e7c66a"/>
  <rect x="304" y="104" width="20" height="52" rx="10" fill="#e7c66a"/>

  <!-- The signature: a confirmed slot locked in with a gold check -->
  <path d="M196 268 l44 46 l86 -104"
        fill="none" stroke="url(#gold)" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- saffron accent dot -->
  <circle cx="360" cy="352" r="16" fill="#e7c66a"/>
</svg>
